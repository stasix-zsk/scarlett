name: Translate README

on:
  push:
    branches: [main]
    paths:
      - README.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translate-readme
  cancel-in-progress: true

jobs:
  translate:
    name: Translate README to ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: Polish
            code: pl
            file: README_PL.md
          - language: Spanish
            code: es
            file: README_ES.md
          - language: German
            code: de
            file: README_DE.md
          - language: Simplified Chinese
            code: zh-CN
            file: README_ZH.md
          - language: Russian
            code: ru
            file: README_RU.md
    steps:
      - uses: actions/checkout@v4

      - name: Translate README
        uses: offensive-vk/auto-translate@v7
        with:
          file: README.md
          language: ${{ matrix.code }}

      - name: Normalize translated file name
        run: |
          if [ -f "README.${{ matrix.code }}.md" ]; then
            mv "README.${{ matrix.code }}.md" "${{ matrix.file }}"
          fi

      - name: Upload translation
        uses: actions/upload-artifact@v7
        with:
          name: translation-${{ matrix.language }}
          path: ${{ matrix.file }}

  commit:
    name: Commit translated READMEs
    needs: translate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download translations
        uses: actions/download-artifact@v8
        with:
          path: .
          merge-multiple: true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README_PL.md README_ES.md README_DE.md README_ZH.md README_RU.md
          if git diff --cached --quiet; then
            echo "No translation changes to commit."
            exit 0
          fi
          git commit -m "docs: update translated READMEs"
          git push