name: Release
on:
  push:
    tags:
      - "v*"
      - "latest"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish"
        required: true
        type: string
      prerelease:
        description: "Publish as a prerelease"
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and publish"
        required: true
        type: string
      prerelease:
        description: "Publish as a prerelease"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build release asset (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then tag="${{ github.ref_name }}"; fi
          prerelease="${{ inputs.prerelease }}"
          if [ -z "$prerelease" ] || [ "$prerelease" = "false" ]; then
            case "$tag" in
              *-*) prerelease="true" ;;
              *) prerelease="false" ;;
            esac
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bin="$(find build -type f -name 'scarlett' | head -n 1)"
          if [ -n "$bin" ]; then strip "$bin" || true; fi

      - name: Prepare asset name
        shell: bash
        run: |
          bin="$(find build -type f \( -name 'scarlett' -o -name 'scarlett.exe' \) | head -n 1)"
          if [ -z "$bin" ]; then
            echo "No compiled scarlett binary found"
            find build -type f
            exit 1
          fi
          case "$RUNNER_OS" in
            Windows) cp "$bin" scarlett-windows.exe ;;
            macOS) cp "$bin" scarlett-macos ;;
            *) cp "$bin" scarlett-linux ;;
          esac
          ls -l scarlett-*

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: scarlett-*
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}