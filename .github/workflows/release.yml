name: Release
on:
  push:
    tags:
      - "v*"
      - "latest"

permissions:
  contents: write

jobs:
  build:
    name: Build release asset (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bin="$(find build -type f -name 'scarlett' | head -n 1)"
          if [ -n "$bin" ]; then strip "$bin" || true; fi

      - name: Prepare asset name
        shell: bash
        run: |
          bin="$(find build -type f \( -name 'scarlett' -o -name 'scarlett.exe' \) | head -n 1)"
          if [ -z "$bin" ]; then
            echo "No compiled scarlett binary found"
            find build -type f
            exit 1
          fi
          case "$RUNNER_OS" in
            Windows) cp "$bin" scarlett-windows.exe ;;
            macOS) cp "$bin" scarlett-macos ;;
            *) cp "$bin" scarlett-linux ;;
          esac
          ls -l scarlett-*

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: scarlett-*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
