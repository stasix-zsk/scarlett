name: Release
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build release asset (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: strip build/scarlett 2>/dev/null || true

      - name: Prepare asset name
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp build/scarlett.exe "scarlett-windows.exe"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cp build/scarlett "scarlett-macos"
          else
            cp build/scarlett "scarlett-linux"
          fi

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: scarlett-*
