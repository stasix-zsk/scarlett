name: Build
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Create a versioned release tag after a successful build"
        type: boolean
        default: false
      version:
        description: "Version to release (overrides VERSION)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Release build (${{ matrix.os }})
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Strip binaries (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bin="$(find build -type f -name 'scarlett' | head -n 1)"
          if [ -n "$bin" ]; then strip "$bin" || true; fi

      - name: Stage binary
        shell: bash
        run: |
          bin="$(find build -type f \( -name 'scarlett' -o -name 'scarlett.exe' \) | head -n 1)"
          if [ -z "$bin" ]; then
            echo "No compiled scarlett binary found"
            find build -type f
            exit 1
          fi
          case "${{ matrix.os }}" in
            ubuntu-latest) cp "$bin" scarlett-linux ;;
            windows-latest) cp "$bin" scarlett-windows.exe ;;
            macos-latest) cp "$bin" scarlett-macos ;;
          esac
          ls -l scarlett-*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: scarlett-${{ matrix.os }}
          path: scarlett-*
          if-no-files-found: error
